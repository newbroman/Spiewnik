# Keeps the Supabase free-tier project awake.
# Free projects pause after 7 days of no activity; this pings the database
# every 3 days so it never sleeps. The anon key is public (safe in the repo);
# row-level security still protects the data.
name: keep-supabase-warm
on:
  schedule:
    - cron: '17 7 */3 * *'   # 07:17 UTC, every 3rd day
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_DK0ayfwXThXmJJhb6-s94Q_pvHPKGXk" \
            "https://dojbhuzdgzkbvvdzxmqw.supabase.co/rest/v1/songs?select=id&limit=1")
          echo "Supabase responded: $code"
          # 200 (rows) or 401/403 (auth/RLS) all count as activity and keep it awake
          if [ "$code" = "000" ]; then echo "No response — project may be unreachable"; exit 1; fi
